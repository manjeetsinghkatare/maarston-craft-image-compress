<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" fill="none">
  <!-- Concept 07: The Prism Cascade (Dark Theme - Yellow + Black) -->
  <defs>
    <linearGradient id="sheet1-yd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854D0E" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="sheet2-yd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="sheet3-yd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <filter id="glow-y" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FACC15" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Group Icon -->
  <g transform="translate(10, 10)">
    <!-- Sheet 1 (Base Layer) -->
    <rect x="6" y="16" width="22" height="38" rx="4.5" fill="url(#sheet1-yd)" stroke="#A16207" stroke-width="1.8" />
    <line x1="11" y1="24" x2="21" y2="24" stroke="#FDE047" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
    <line x1="11" y1="30" x2="18" y2="30" stroke="#FDE047" stroke-width="1.8" stroke-linecap="round" opacity="0.4" />

    <!-- Sheet 2 (Elevated Active Yellow Layer) -->
    <rect x="20" y="6" width="22" height="38" rx="4.5" fill="url(#sheet2-yd)" stroke="#FEF08A" stroke-width="2" filter="url(#glow-y)" />
    <circle cx="27" cy="14" r="2.2" fill="#0C0A09" />
    <path d="M23 27 L28 20 L33 25 L38 18" stroke="#0C0A09" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sheet 3 (Output Layer) -->
    <rect x="34" y="16" width="22" height="38" rx="4.5" fill="url(#sheet3-yd)" stroke="#FFFFFF" stroke-width="1.8" />
    <line x1="40" y1="24" x2="49" y2="24" stroke="#713F12" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    <line x1="40" y1="30" x2="47" y2="30" stroke="#713F12" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Typography -->
  <text x="82" y="44" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5px">MaarstOn</text>
  <text x="214" y="44" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="700" fill="#FACC15" letter-spacing="-0.5px">Craft</text>
  <text x="83" y="61" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9.5" font-weight="700" fill="#94A3B8" letter-spacing="3.2px">IMAGE COMPRESS</text>
</svg>
